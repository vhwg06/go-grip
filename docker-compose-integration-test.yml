version: "3.9"

services:
  # Integration tests exercise the app directly with httptest and do not need
  # the local reverse proxy.  The base compose file still defines nginx for
  # local development, where its optional RabbitMQ/NATS upstreams are present.
  # Keep that service out of CI so a missing optional upstream cannot prevent
  # the integration container from starting.
  nginx:
    profiles: ["local"]

  db:
    container_name: integration-db
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: myAwEsOm3pa55@w0rd
    networks:
      app_network:
        aliases:
          - db

  app:
    container_name: integration-app
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: go-clean-template
      APP_VERSION: 1.0.0
      HTTP_PORT: "8080"
      HTTP_USE_PREFORK_MODE: "false"
      LOG_LEVEL: debug
      PG_POOL_MAX: "2"
      PG_URL: postgres://user:myAwEsOm3pa55@w0rd@db:5432/db?sslmode=disable
      METRICS_ENABLED: "false"
      SWAGGER_ENABLED: "false"
      JWT_TOKEN_EXPIRY: 24h
      JWT_SECRET: your-secret-key-change-in-production
      ADMIN_USERS: ""
      PAYMENT_PROVIDER: epay
      PAYMENT_MERCHANT_ID: ""
      PAYMENT_SECRET_KEY: ""
      PAYMENT_BASE_URL: ""
      PAYMENT_NOTIFY_URL: ""
      PAYMENT_RETURN_URL: ""
      PAYMENT_ORDER_TIMEOUT_MINUTES: "5"
    depends_on:
      - db
    networks:
      app_network:
        aliases:
          - app

  integration-test:
    container_name: integration-test
    platform: linux/amd64
    pid: "host"
    build:
      context: .
      dockerfile: integration-test/Dockerfile
    depends_on:
      - app
    networks:
      app_network:
        aliases:
          - test.lvh.me

networks:
  app_network:
    external: false
