components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT authentication header
  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: johndoe
        email:
          type: string
          example: john@example.com
        password:
          type: string
          example: secret123
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: john@example.com
        password:
          type: string
          example: secret123
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          example: token-uuid
        refresh_token:
          type: string
          x-go-name: LegacyRefreshToken
          example: token-uuid
    CreateAdminUserRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: adminuser
        email:
          type: string
          example: admin@example.com
        password:
          type: string
          example: secret123
        role:
          type: string
          example: Admin
    UpdateProfileRequest:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          example: John Doe
    UserResponse:
      type: object
      required:
        - id
        - username
        - email
      properties:
        id:
          type: string
          example: user-123
        username:
          type: string
          example: johndoe
        email:
          type: string
          example: john@example.com
        role:
          type: string
          example: Subscriber
        is_admin:
          type: boolean
          example: false
        is_blocked:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
    UserListResponse:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        total:
          type: integer
          example: 42
    ProductRequest:
      type: object
      required:
        - title
        - price
      properties:
        title:
          type: string
          example: Grip T-Shirt
        slug:
          type: string
          example: grip-t-shirt
        description:
          type: string
          example: Premium cotton t-shirt
        price:
          type: integer
          example: 2500
        stock:
          type: integer
          example: 100
        sku:
          type: string
          example: GRIP-TSHIRT-01
        category_id:
          type: string
          example: cat-10
        image_url:
          type: string
          example: https://example.com/item.png
    ProductResponse:
      type: object
      required:
        - id
        - title
        - price
      properties:
        id:
          type: string
          example: prd-100
        title:
          type: string
          example: Grip T-Shirt
        slug:
          type: string
          example: grip-t-shirt
        description:
          type: string
          example: Premium cotton t-shirt
        price:
          type: integer
          example: 2500
        stock:
          type: integer
          example: 100
        sku:
          type: string
          example: GRIP-TSHIRT-01
        category_id:
          type: string
          example: cat-10
        image_url:
          type: string
          example: https://example.com/item.png
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductListResponse:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
